<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>RU - Resultado da Validação</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; color: #222; margin: 0; }
    .container { max-width: 560px; margin: 60px auto; background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    h1 { font-size: 1.3rem; color: #0b5d2e; }
    .campo { margin-bottom: 16px; }
    .campo span.rotulo { display: block; font-size: 0.8rem; color: #666; text-transform: uppercase; margin-bottom: 4px; }
    pre { background: #0d1117; color: #c9d1d9; padding: 14px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
    a.voltar { display: inline-block; margin-top: 12px; color: #0b5d2e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Resultado da validação de matrícula</h1>

    <div class="campo">
      <span class="rotulo">Conteúdo lido do QR Code</span>
      <pre>{{ matricula }}</pre>
    </div>

    <div class="campo">
      <span class="rotulo">Saída do sistema legado</span>
      <pre>{{ saida }}</pre>
    </div>

    <a class="voltar" href="/">&larr; Validar outra carteirinha</a>
  </div>
</body>
</html>
