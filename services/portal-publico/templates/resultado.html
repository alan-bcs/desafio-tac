<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>SRU - Resultado da Validação</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="barra-topo">
    <div class="marca">UnB &mdash; <span class="sigla">SRU</span> &mdash; Sistema de Recarga do RU</div>
    <div class="links-topo">
      <a href="/">Início</a>
      <a href="#">Ajuda?</a>
    </div>
  </div>

  <main>
    <div class="cartao">
      <div class="cabecalho-cartao">
        <h1>Resultado da validação de matrícula</h1>
      </div>
      <div class="corpo-cartao">
        <label>Conteúdo lido do QR Code</label>
        <pre class="saida">{{ matricula }}</pre>

        <label>Saída do sistema legado</label>
        <pre class="saida">{{ saida }}</pre>

        <p><a class="link-padrao" href="/">&larr; Validar outra carteirinha</a></p>
      </div>
    </div>

    <footer class="rodape">Sistema de Recarga do RU &mdash; versão integrada com o sistema acadêmico legado.</footer>
  </main>
</body>
</html>
